<html lang="zh-CN">

<meta charset="UTF-8">

<title>背单词大冒险 - 金币挑战</title>
<style>
  :root{
    --bg1:#1b1f3b;
    --bg2:#2a2f5e;
    --card:#ffffff;
    --primary:#4f6df5;
    --gold:#f5b942;
    --green:#2ecc71;
    --red:#e74c3c;
    --text:#222;
    --muted:#888;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .app{
    width:100%;
    max-width:720px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:#fff;
    margin-bottom:16px;
    padding:0 6px;
  }
  .title{
    font-size:22px;
    font-weight:700;
    letter-spacing:1px;
  }
  .gold-badge{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.12);
    padding:8px 16px;
    border-radius:999px;
    font-weight:700;
    font-size:18px;
  }
  .gold-badge .coin{
    width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff4cc, var(--gold) 60%, #b8860b 100%);
    display:inline-block;
    box-shadow:0 0 6px rgba(245,185,66,.8);
  }
  .card{
    background:var(--card);
    border-radius:20px;
    padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    min-height:420px;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .timer-wrap{
    height:10px;
    background:#eee;
    border-radius:6px;
    overflow:hidden;
    margin-bottom:20px;
  }
  .timer-bar{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,var(--green),var(--gold),var(--red));
    transition:width .1s linear;
  }
  .stage-label{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-bottom:14px;
  }
  .word-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    flex:1;
  }
  .word-btn{
    border:2px solid #e5e8f5;
    background:#f7f8fd;
    border-radius:14px;
    padding:18px 12px;
    cursor:pointer;
    text-align:center;
    transition:all .15s ease;
    display:flex;
    flex-direction:column;
    gap:6px;
    align-items:center;
    justify-content:center;
  }
  .word-btn:hover{
    border-color:var(--primary);
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(79,109,245,.25);
  }
  .word-btn .level-tag{
    font-size:12px;
    font-weight:700;
    padding:2px 10px;
    border-radius:999px;
    color:#fff;
  }
  .word-btn .en{
    font-size:22px;
    font-weight:700;
    color:var(--text);
  }
  .word-btn .reward{
    font-size:13px;
    color:var(--gold);
    font-weight:700;
  }
  .lv-primary{background:#5dd39e;}
  .lv-middle{background:#4f9df5;}
  .lv-high{background:#a86df5;}
  .lv-cet4{background:#f56d6d;}

  .meaning-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    flex:1;
  }
  .meaning-btn{
    border:2px solid #e5e8f5;
    background:#f7f8fd;
    border-radius:14px;
    padding:20px 12px;
    cursor:pointer;
    text-align:center;
    font-size:18px;
    font-weight:600;
    color:var(--text);
    transition:all .15s ease;
  }
  .meaning-btn:hover{
    border-color:var(--primary);
    transform:translateY(-3px);
  }
  .meaning-btn.correct{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
  }
  .meaning-btn.wrong{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
  }
  .selected-word{
    text-align:center;
    margin-bottom:16px;
  }
  .selected-word .en{
    font-size:34px;
    font-weight:800;
    color:var(--primary);
  }
  .selected-word .tag{
    display:inline-block;
    margin-top:6px;
    font-size:13px;
    color:#fff;
    padding:2px 12px;
    border-radius:999px;
  }
  .feedback{
    text-align:center;
    font-size:20px;
    font-weight:800;
    margin:0 8px;
    padding:20px;
    position:absolute;
    left:0;
    right:0;
    top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,.97);
    border-radius:16px;
  }
  .feedback.good{color:var(--green);}
  .feedback.bad{color:var(--red);}
  .feedback .sub{
    display:block;
    font-size:14px;
    color:var(--muted);
    font-weight:400;
    margin-top:8px;
  }
  .stats{
    display:flex;
    justify-content:space-around;
    color:#fff;
    margin-top:14px;
    font-size:13px;
    opacity:.85;
  }
  .gameover{
    text-align:center;
    padding:20px 0;
  }
  .gameover h2{
    font-size:28px;
    margin-bottom:6px;
  }
  .gameover .final-gold{
    font-size:48px;
    font-weight:800;
    color:var(--gold);
    margin:10px 0;
  }
  .gameover .row{
    display:flex;
    justify-content:space-between;
    padding:8px 30px;
    color:var(--muted);
    font-size:15px;
  }
  .restart-btn{
    margin-top:20px;
    display:inline-block;
    background:var(--primary);
    color:#fff;
    border:none;
    padding:12px 32px;
    border-radius:999px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .restart-btn:hover{
    opacity:.9;
  }
  .rules{
    color:rgba(255,255,255,.7);
    font-size:12px;
    text-align:center;
    margin-top:14px;
    line-height:1.7;
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .user-badge{
    display:flex;
    align-items:center;
    gap:8px;
    color:#fff;
    font-size:14px;
  }
  .logout-btn{
    background:rgba(255,255,255,.15);
    color:#fff;
    border:none;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
    cursor:pointer;
  }
  .logout-btn:hover{
    background:rgba(255,255,255,.28);
  }
  .auth-overlay{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .auth-card{
    background:var(--card);
    border-radius:20px;
    padding:32px 28px;
    width:100%;
    max-width:340px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .auth-title{
    font-size:22px;
    font-weight:800;
    text-align:center;
    color:var(--text);
  }
  .auth-sub{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    line-height:1.6;
    margin-bottom:4px;
  }
  .auth-input{
    padding:12px 14px;
    border-radius:10px;
    border:2px solid #e5e8f5;
    font-size:15px;
    outline:none;
  }
  .auth-input:focus{
    border-color:var(--primary);
  }
  .auth-error{
    color:var(--red);
    font-size:13px;
    text-align:center;
    min-height:16px;
  }
  .auth-btn{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:12px;
    border-radius:999px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .auth-btn:hover{
    opacity:.9;
  }
  .leaderboard{
    background:#f7f8fd;
    border-radius:14px;
    padding:14px 16px;
    margin:16px 0;
    text-align:left;
  }
  .lb-title{
    font-weight:800;
    margin-bottom:8px;
    color:var(--text);
  }
  .lb-me{
    font-size:13px;
    color:var(--muted);
    line-height:1.8;
    margin-bottom:10px;
  }
  .lb-me b{
    color:var(--text);
  }
  .leaderboard-row{
    display:flex;
    justify-content:space-between;
    padding:8px 10px;
    border-radius:8px;
    font-size:14px;
    margin-bottom:6px;
    background:#eef0fb;
  }
  .leaderboard-row.me{
    background:rgba(79,109,245,.12);
    font-weight:700;
    color:var(--primary);
  }
  .leaderboard-row.muted{
    color:var(--muted);
    justify-content:center;
    background:transparent;
  }
  .switch-user-btn{
    margin-top:10px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
    display:block;
    margin-left:auto;
    margin-right:auto;
  }
</style>
</head>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-title">📚 背单词大冒险</div>
    <div class="auth-sub">首次输入用户名和密码即自动注册，之后用同样的用户名密码登录即可继续累计积分</div>
    <input class="auth-input" id="authUsername" type="text" placeholder="用户名" maxlength="16" autocomplete="off" />
    <input class="auth-input" id="authPassword" type="password" placeholder="密码" maxlength="32" autocomplete="off" />
    <div class="auth-error" id="authError"></div>
    <button class="auth-btn" id="authSubmitBtn">登录 / 注册</button>
  </div>
</div>

<div class="app">
  <div class="topbar">
    <div class="title">📚 背单词大冒险</div>

    </div>
  </div>

  <div class="card" id="card">
    <!-- filled by JS -->
  </div>

  <div class="stats">
    <span>第 <b id="roundCount">0</b> 轮</span>

    <span>累计获得 <b id="earnedCount">0</b> 金币</span>
  </div>

  <div class="rules">
    初始10金币 · 每轮花费2金币 · 小学词+1 初中词+3 高中词+5 四级词+10 · 每轮限时10秒 · 金币耗尽游戏结束
  </div>
</div>

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function sbFetch(path, options={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> "");
    throw new Error(`Supabase请求失败(${res.status}): ${errText}`);
  }
  if(res.status === 204) return null;
  return res.json();
}

async function fetchAccount(username){
  const rows = await sbFetch(`accounts?username=eq.${encodeURIComponent(username)}&select=*`);
  return rows && rows.length ? rows[0] : null;
}

async function createAccount(username, passwordHash){
  const rows = await sbFetch(`accounts`, {
    method: "POST",
    headers: { "Prefer": "return=representation" },
    body: JSON.stringify({ username, password_hash: passwordHash })
  });
  return rows[0];
}

async function updateAccountScore(username, totalScore, bestSession, gamesPlayed){
  await sbFetch(`accounts?username=eq.${encodeURIComponent(username)}`, {
    method: "PATCH",
    body: JSON.stringify({ total_score: totalScore, best_session: bestSession, games_played: gamesPlayed })
  });
}

async function fetchLeaderboard(){
  return await sbFetch(`accounts?select=username,total_score&order=total_score.desc`);
}

  authErrorEl.textContent = "";
  if(!username){ authErrorEl.textContent = "请输入用户名"; return; }
  if(!password){ authErrorEl.textContent = "请输入密码"; return; }

  authSubmitBtnEl.disabled = true;
  const originalLabel = authSubmitBtnEl.textContent;
  authSubmitBtnEl.textContent = "连接中...";

  try{
    const passwordHash = await sha256Hex(password);
    const existing = await fetchAccount(username);
    if(existing){
      if(existing.password_hash !== passwordHash){
        authErrorEl.textContent = "密码不正确";
        return;
      }
    }else{
      try{
        await createAccount(username, passwordHash);
      }catch(err){
        authErrorEl.textContent = "该用户名可能已被注册，请重试";
        return;
      }
    }
    setCurrentUsername(username);
    enterGame(username);
  }catch(err){
    console.error(err);
    authErrorEl.textContent = "网络错误，请检查网络后重试";
  }finally{
    authSubmitBtnEl.disabled = false;
    authSubmitBtnEl.textContent = originalLabel;
  }
}

function handleLogout(){
  clearTimer();
  setCurrentUsername(null);
  showAuthOverlay();
}

authSubmitBtnEl.addEventListener("click", handleAuthSubmit);
logoutBtnEl.addEventListener("click", handleLogout);
[authUsernameEl, authPasswordEl].forEach(el=>{
  el.addEventListener("keydown", e=>{
    if(e.key === "Enter") handleAuthSubmit();
  });
});

function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function buildRoundWords(){
  return {
    primary: pickRandom(WORD_BANK.primary),
    middle:  pickRandom(WORD_BANK.middle),
    high:    pickRandom(WORD_BANK.high),
    cet4:    pickRandom(WORD_BANK.cet4),
  };
}

function buildMeaningChoices(correctZh){
  const wrongPool = ALL_MEANINGS.filter(m => m !== correctZh);
  const wrongs = [];
  while(wrongs.length < 3 && wrongPool.length){
    const idx = Math.floor(Math.random()*wrongPool.length);
    const val = wrongPool.splice(idx,1)[0];
    if(!wrongs.includes(val)) wrongs.push(val);
  }
  const choices = [correctZh, ...wrongs];
  for(let i=choices.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [choices[i],choices[j]] = [choices[j],choices[i]];
  }
  return choices;
}

function updateTopStats(){
  goldCountEl.textContent = gold;
  roundCountEl.textContent = round;
  correctCountEl.textContent = correctCount;
  earnedCountEl.textContent = earnedCount;
}

function clearTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
}

function startTimerBar(onTimeout){
  timeLeft = ROUND_TIME;
  const bar = document.getElementById("timerBar");
  clearTimer();
  timerId = setInterval(()=>{
    timeLeft -= 0.1;
    if(bar) bar.style.width = Math.max(0,(timeLeft/ROUND_TIME*100)) + "%";
    if(timeLeft <= 0){
      clearTimer();
      onTimeout();
    }
  }, 100);
}

function startRound(){
  if(gold < ROUND_COST){
    endGame();
    return;
  }
  gold -= ROUND_COST;
  round += 1;
  updateTopStats();
  currentRoundWords = buildRoundWords();
  stage = "picking";
  renderPicking();
}

function renderTimerWrap(){
  return `<div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>`;
}

function renderPicking(){
  const w = currentRoundWords;
  card.innerHTML = `
    ${renderTimerWrap()}
    <div class="stage-label">选择一个单词进行挑战（等级越高奖励越多）</div>
    <div class="word-grid">
      ${Object.keys(LEVELS).map(lv => {
        const info = LEVELS[lv];
        const [en] = w[lv];
        return `<div class="word-btn" data-lv="${lv}">
          <span class="level-tag ${info.cls}">${info.label} · +${info.reward}金币</span>
          <span class="en">${en}</span>
        </div>`;
      }).join("")}
    </div>
  `;
  document.getElementById("timerBar").style.width = "100%";
  document.querySelectorAll(".word-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(stage !== "picking") return;
      onWordPicked(btn.dataset.lv);
    });
  });
  startTimerBar(()=> onTimeout());
}

function onWordPicked(lv){
  clearTimer();
  stage = "meaning";
  renderMeaning(lv);
}

function renderMeaning(lv){
  const info = LEVELS[lv];
  const [en, zh] = currentRoundWords[lv];
  const choices = buildMeaningChoices(zh);
  card.innerHTML = `
    ${renderTimerWrap()}
    <div class="selected-word">
      <div class="en">${en}</div>
      <span class="tag ${info.cls}">${info.label} · 答对得 ${info.reward} 金币</span>
    </div>
    <div class="meaning-grid">
      ${choices.map(c => `<div class="meaning-btn" data-zh="${c}">${c}</div>`).join("")}
    </div>
  `;
  document.getElementById("timerBar").style.width = Math.max(0,(timeLeft/ROUND_TIME*100)) + "%";
  document.querySelectorAll(".meaning-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(stage !== "meaning") return;
      onMeaningPicked(btn.dataset.zh, zh, lv);
    });
  });
  startTimerBar(()=> onTimeout(lv, zh));
}

function onMeaningPicked(picked, correctZh, lv){
  clearTimer();
  stage = "feedback";
  const isCorrect = picked === correctZh;
  document.querySelectorAll(".meaning-btn").forEach(btn=>{
    if(btn.dataset.zh === correctZh) btn.classList.add("correct");
    else if(btn.dataset.zh === picked) btn.classList.add("wrong");
  });
  if(isCorrect){
    const reward = LEVELS[lv].reward;
    gold += reward;
    correctCount += 1;
    earnedCount += reward;
    updateTopStats();
    showFeedback(true, `回答正确！获得 ${reward} 金币`, `当前金币：${gold}`);
  }else{
    showFeedback(false, `回答错误`, `正确答案：${correctZh}`);
  }
  scheduleNextRound();
}

function onTimeout(lv, correctZh){
  clearTimer();
  stage = "feedback";
  if(lv && correctZh){
    document.querySelectorAll(".meaning-btn").forEach(btn=>{
      if(btn.dataset.zh === correctZh) btn.classList.add("correct");
    });
    showFeedback(false, `超时啦`, `正确答案：${correctZh}`);
  }else{
    showFeedback(false, `超时啦`, `未能及时选择单词`);
  }
  scheduleNextRound();
}

function showFeedback(good, main, sub){
  const toast = document.createElement("div");
  toast.className = "feedback " + (good ? "good":"bad");
  toast.innerHTML = `${main}<span class="sub">${sub}</span>`;
  card.appendChild(toast);
}

function scheduleNextRound(){
  setTimeout(()=>{
    if(gold < ROUND_COST){
      endGame();
    }else{
      startRound();
    }
  }, 1400);
}

async function endGame(){
  stage = "over";
  clearTimer();

  card.innerHTML = `<div class="feedback good">正在结算成绩...<span class="sub">正在连接排行榜</span></div>`;

  const username = getCurrentUsername();
  let account = null;
  let ranked = [];
  let myRank = 0;
  let totalUsers = 0;
  let above = null;
  let below = null;
  let leaderboardError = false;

  try{
    account = await fetchAccount(username);
    if(!account) throw new Error("account not found");

    const newTotal = (account.total_score || 0) + earnedCount;
    const newBest = Math.max(account.best_session || 0, earnedCount);
    const newGamesPlayed = (account.games_played || 0) + 1;
    await updateAccountScore(username, newTotal, newBest, newGamesPlayed);
    account.total_score = newTotal;
    account.best_session = newBest;
    account.games_played = newGamesPlayed;

    const all = await fetchLeaderboard();
    ranked = all
      .map(r => ({ name: r.username, score: r.total_score || 0 }))
      .sort((a,b) => b.score - a.score || a.name.localeCompare(b.name));
    const myIndex = ranked.findIndex(r => r.name === username);
    myRank = myIndex + 1;
    totalUsers = ranked.length;
    above = myIndex > 0 ? ranked[myIndex-1] : null;
    below = myIndex >= 0 && myIndex < ranked.length-1 ? ranked[myIndex+1] : null;
  }catch(err){
    console.error(err);
    leaderboardError = true;
  }

  const leaderboardHtml = leaderboardError
    ? `<div class="leaderboard">
        <div class="lb-title">🏆 排行榜</div>
        <div class="lb-me">排行榜加载失败，请检查网络连接后点"再来一局"重试</div>
      </div>`
    : `<div class="leaderboard">
        <div class="lb-title">🏆 排行榜</div>
        <div class="lb-me">
          <div>当前积分：<b>${account.total_score}</b></div>
          <div>历史最高单局：<b>${account.best_session}</b></div>
          <div>当前排名：<b>第 ${myRank} 名</b>（共 ${totalUsers} 人）</div>
        </div>
        <div class="lb-list">
          ${above
            ? `<div class="leaderboard-row"><span>↑ ${escapeHtml(above.name)}</span><span>${above.score} 分</span></div>`
            : `<div class="leaderboard-row muted"><span>你已是第一名</span></div>`}
          <div class="leaderboard-row me"><span>${escapeHtml(username)}（我）</span><span>${account.total_score} 分</span></div>
          ${below
            ? `<div class="leaderboard-row"><span>↓ ${escapeHtml(below.name)}</span><span>${below.score} 分</span></div>`
            : `<div class="leaderboard-row muted"><span>你已是最后一名</span></div>`}
        </div>
      </div>`;

  card.innerHTML = `
    <div class="gameover">
      <h2>🎮 游戏结束</h2>
      <div class="final-gold">${gold} 金币</div>
      <div class="row"><span>总轮数</span><span>${round}</span></div>
      <div class="row"><span>答对次数</span><span>${correctCount}</span></div>
      <div class="row"><span>正确率</span><span>${round ? Math.round(correctCount/round*100) : 0}%</span></div>
      <div class="row"><span>本局获得金币</span><span>${earnedCount}</span></div>
      ${leaderboardHtml}
      <button class="restart-btn" id="restartBtn">再来一局</button>
      <button class="switch-user-btn" id="switchUserBtn">切换账号</button>
    </div>
  `;
  document.getElementById("restartBtn").addEventListener("click", resetGame);
  document.getElementById("switchUserBtn").addEventListener("click", handleLogout);
}

function resetGame(){
  gold = START_GOLD;
  round = 0;
  correctCount = 0;
  earnedCount = 0;
  updateTopStats();
  startRound();
}

async function init(){
  const savedUser = getCurrentUsername();
  if(savedUser){
    try{
      const account = await fetchAccount(savedUser);
      if(account){
        enterGame(savedUser);
        return;
      }
    }catch(err){
      console.error(err);
    }
  }
  showAuthOverlay();
}

init();
</script>
