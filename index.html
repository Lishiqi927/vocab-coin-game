<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背单词大冒险 - 金币挑战</title>
<style>
  :root{
    --bg1:#1b1f3b;
    --bg2:#2a2f5e;
    --card:#ffffff;
    --primary:#4f6df5;
    --gold:#f5b942;
    --green:#2ecc71;
    --red:#e74c3c;
    --text:#222;
    --muted:#888;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .app{
    width:100%;
    max-width:720px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:#fff;
    margin-bottom:16px;
    padding:0 6px;
  }
  .title{
    font-size:22px;
    font-weight:700;
    letter-spacing:1px;
  }
  .gold-badge{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.12);
    padding:8px 16px;
    border-radius:999px;
    font-weight:700;
    font-size:18px;
  }
  .gold-badge .coin{
    width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff4cc, var(--gold) 60%, #b8860b 100%);
    display:inline-block;
    box-shadow:0 0 6px rgba(245,185,66,.8);
  }
  .card{
    background:var(--card);
    border-radius:20px;
    padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    min-height:420px;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .timer-wrap{
    height:10px;
    background:#eee;
    border-radius:6px;
    overflow:hidden;
    margin-bottom:20px;
  }
  .timer-bar{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,var(--green),var(--gold),var(--red));
    transition:width .1s linear;
  }
  .stage-label{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-bottom:14px;
  }
  .word-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    flex:1;
  }
  .word-btn{
    border:2px solid #e5e8f5;
    background:#f7f8fd;
    border-radius:14px;
    padding:18px 12px;
    cursor:pointer;
    text-align:center;
    transition:all .15s ease;
    display:flex;
    flex-direction:column;
    gap:6px;
    align-items:center;
    justify-content:center;
  }
  .word-btn:hover{
    border-color:var(--primary);
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(79,109,245,.25);
  }
  .word-btn .level-tag{
    font-size:12px;
    font-weight:700;
    padding:2px 10px;
    border-radius:999px;
    color:#fff;
  }
  .word-btn .en{
    font-size:22px;
    font-weight:700;
    color:var(--text);
  }
  .word-btn .phonetic{
    font-size:13px;
    color:var(--muted);
  }
  .word-btn .reward{
    font-size:13px;
    color:var(--gold);
    font-weight:700;
  }
  .lv-primary{background:#5dd39e;}
  .lv-middle{background:#4f9df5;}
  .lv-high{background:#a86df5;}
  .lv-cet4{background:#f56d6d;}

  .meaning-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    flex:1;
  }
  .meaning-btn{
    border:2px solid #e5e8f5;
    background:#f7f8fd;
    border-radius:14px;
    padding:20px 12px;
    cursor:pointer;
    text-align:center;
    font-size:18px;
    font-weight:600;
    color:var(--text);
    transition:all .15s ease;
  }
  .meaning-btn:hover{
    border-color:var(--primary);
    transform:translateY(-3px);
  }
  .meaning-btn.correct{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
  }
  .meaning-btn.wrong{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
  }
  .selected-word{
    text-align:center;
    margin-bottom:16px;
  }
  .selected-word .en{
    font-size:34px;
    font-weight:800;
    color:var(--primary);
  }
  .selected-word .phonetic{
    font-size:15px;
    color:var(--muted);
    margin-top:2px;
  }
  .selected-word .tag{
    display:inline-block;
    margin-top:6px;
    font-size:13px;
    color:#fff;
    padding:2px 12px;
    border-radius:999px;
  }
  .feedback{
    text-align:center;
    font-size:20px;
    font-weight:800;
    margin:0 8px;
    padding:20px;
    position:absolute;
    left:0;
    right:0;
    top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,.97);
    border-radius:16px;
  }
  .feedback.good{color:var(--green);}
  .feedback.bad{color:var(--red);}
  .feedback .sub{
    display:block;
    font-size:14px;
    color:var(--muted);
    font-weight:400;
    margin-top:8px;
  }
  .stats{
    display:flex;
    justify-content:space-around;
    color:#fff;
    margin-top:14px;
    font-size:13px;
    opacity:.85;
  }
  .gameover{
    text-align:center;
    padding:20px 0;
  }
  .gameover h2{
    font-size:28px;
    margin-bottom:6px;
  }
  .gameover .final-score{
    font-size:48px;
    font-weight:800;
    color:var(--gold);
    margin:10px 0;
  }
  .gameover .row{
    display:flex;
    justify-content:space-between;
    padding:8px 30px;
    color:var(--muted);
    font-size:15px;
  }
  .restart-btn{
    margin-top:20px;
    display:inline-block;
    background:var(--primary);
    color:#fff;
    border:none;
    padding:12px 32px;
    border-radius:999px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .restart-btn:hover{
    opacity:.9;
  }
  .rules{
    color:rgba(255,255,255,.7);
    font-size:12px;
    text-align:center;
    margin-top:14px;
    line-height:1.7;
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .user-badge{
    display:flex;
    align-items:center;
    gap:8px;
    color:#fff;
    font-size:14px;
  }
  .logout-btn{
    background:rgba(255,255,255,.15);
    color:#fff;
    border:none;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
    cursor:pointer;
  }
  .logout-btn:hover{
    background:rgba(255,255,255,.28);
  }
  .auth-overlay{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .auth-card{
    background:var(--card);
    border-radius:20px;
    padding:32px 28px;
    width:100%;
    max-width:340px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .auth-title{
    font-size:22px;
    font-weight:800;
    text-align:center;
    color:var(--text);
  }
  .auth-sub{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    line-height:1.6;
    margin-bottom:4px;
  }
  .auth-input{
    padding:12px 14px;
    border-radius:10px;
    border:2px solid #e5e8f5;
    font-size:15px;
    outline:none;
  }
  .auth-input:focus{
    border-color:var(--primary);
  }
  .auth-error{
    color:var(--red);
    font-size:13px;
    text-align:center;
    min-height:16px;
  }
  .auth-btn{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:12px;
    border-radius:999px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .auth-btn:hover{
    opacity:.9;
  }
  .leaderboard{
    background:#f7f8fd;
    border-radius:14px;
    padding:14px 16px;
    margin:16px 0;
    text-align:left;
  }
  .lb-title{
    font-weight:800;
    margin-bottom:8px;
    color:var(--text);
  }
  .lb-me{
    font-size:13px;
    color:var(--muted);
    line-height:1.8;
    margin-bottom:10px;
  }
  .lb-me b{
    color:var(--text);
  }
  .leaderboard-row{
    display:flex;
    justify-content:space-between;
    padding:8px 10px;
    border-radius:8px;
    font-size:14px;
    margin-bottom:6px;
    background:#eef0fb;
  }
  .leaderboard-row.me{
    background:rgba(79,109,245,.12);
    font-weight:700;
    color:var(--primary);
  }
  .leaderboard-row.muted{
    color:var(--muted);
    justify-content:center;
    background:transparent;
  }
  .wrong-words{
    background:#fff5f5;
    border-radius:14px;
    padding:14px 16px;
    margin:16px 0;
    text-align:left;
  }
  .wrong-list{
    max-height:180px;
    overflow-y:auto;
  }
  .wrong-row{
    display:flex;
    justify-content:space-between;
    padding:8px 10px;
    border-radius:8px;
    font-size:14px;
    margin-bottom:6px;
    background:#fdeaea;
  }
  .wrong-en{
    font-weight:700;
    color:var(--text);
  }
  .wrong-phonetic{
    font-weight:400;
    font-size:12px;
    color:var(--muted);
  }
  .wrong-zh{
    color:#d9534f;
  }
  .result-layout{
    display:flex;
    gap:20px;
    align-items:flex-start;
  }
  .result-layout .gameover{
    flex:1;
    min-width:0;
  }
  .global-board{
    width:220px;
    flex-shrink:0;
    background:#f7f8fd;
    border-radius:14px;
    padding:14px 16px;
    text-align:left;
  }
  .global-board .lb-title{
    font-weight:800;
    margin-bottom:10px;
    color:var(--text);
  }
  .global-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 8px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:5px;
    background:#eef0fb;
  }
  .global-row.me{
    background:rgba(79,109,245,.12);
    font-weight:700;
    color:var(--primary);
  }
  .global-rank{
    width:20px;
    text-align:center;
    font-weight:800;
    color:var(--muted);
  }
  .global-row.top1 .global-rank{ color:#f5b942; }
  .global-row.top2 .global-rank{ color:#b0b0b0; }
  .global-row.top3 .global-rank{ color:#cd7f32; }
  .global-name{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .global-score{
    font-weight:700;
  }
  .global-empty{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:10px 0;
  }
  @media (max-width:600px){
    .result-layout{
      flex-direction:column;
      align-items:stretch;
    }
    .global-board{
      width:100%;
    }
  }
  .switch-user-btn{
    margin-top:10px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
    display:block;
    margin-left:auto;
    margin-right:auto;
  }
  @media (max-width:480px){
    body{
      padding:10px;
      align-items:flex-start;
    }
    .title{
      font-size:18px;
    }
    .gold-badge{
      padding:6px 12px;
      font-size:15px;
      gap:6px;
    }
    .card{
      padding:16px;
      border-radius:16px;
      min-height:0;
    }
    .word-grid,.meaning-grid{
      gap:10px;
    }
    .word-btn{
      padding:14px 8px;
    }
    .word-btn .en{
      font-size:18px;
    }
    .meaning-btn{
      padding:14px 8px;
      font-size:15px;
    }
    .selected-word .en{
      font-size:26px;
    }
    .feedback{
      font-size:17px;
      padding:16px;
    }
    .stats{
      font-size:11px;
    }
    .rules{
      font-size:11px;
    }
    .gameover h2{
      font-size:22px;
    }
    .gameover .final-score{
      font-size:34px;
    }
    .gameover .row{
      padding:8px 6px;
      font-size:14px;
    }
    .restart-btn{
      width:100%;
      padding:12px 0;
    }
  }
</style>
</head>
<body>
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-title">📚 背单词大冒险</div>
    <div class="auth-sub">首次输入用户名和密码即自动注册，之后用同样的用户名密码登录即可继续累计积分</div>
    <input class="auth-input" id="authUsername" type="text" placeholder="用户名" maxlength="16" autocomplete="off" />
    <input class="auth-input" id="authPassword" type="password" placeholder="密码" maxlength="32" autocomplete="off" />
    <div class="auth-error" id="authError"></div>
    <button class="auth-btn" id="authSubmitBtn">登录 / 注册</button>
  </div>
</div>

<div class="app">
  <div class="topbar">
    <div class="title">📚 背单词大冒险</div>
    <div class="topbar-right">
      <div class="user-badge" id="userBadge" style="display:none;">
        <span id="usernameLabel"></span>
        <button class="logout-btn" id="logoutBtn">退出登录</button>
      </div>
      <div class="gold-badge"><span class="coin"></span><span id="goldCount">10</span></div>
    </div>
  </div>

  <div class="card" id="card">
    <!-- filled by JS -->
  </div>

  <div class="stats">
    <span>第 <b id="roundCount">0</b> 轮</span>
    <span>答对 <b id="correctCount">0</b> 次</span>
    <span>本局得分 <b id="earnedCount">0</b></span>
  </div>

  <div class="rules">
    初始10金币 · 每轮花费2金币 · 答对：小学+1 初中+3 高中+5 四级+10 · 答错/超时倒扣同等金币 · 每轮限时10秒 · 金币耗尽游戏结束
  </div>
</div>

function parseWordList(raw) {
  return raw
    .split("\n")
    .map(line => line.trim())
    .filter(line => line.length > 0)
    .map(line => line.split("|"));
}

const WORD_BANK = {
  primary: parseWordList(RAW_PRIMARY),
  middle: parseWordList(RAW_MIDDLE),
  high: parseWordList(RAW_HIGH),
  cet4: parseWordList(RAW_CET4),
};

const ALL_MEANINGS = Object.values(WORD_BANK).flat().map(w => w[2]);

let wordPools = { primary: [], middle: [], high: [], cet4: [] };

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function resetWordPools(){
  wordPools = {
    primary: shuffleArray([...WORD_BANK.primary]),
    middle: shuffleArray([...WORD_BANK.middle]),
    high: shuffleArray([...WORD_BANK.high]),
    cet4: shuffleArray([...WORD_BANK.cet4]),
  };
}

function drawWord(level){
  return wordPools[level].length ? wordPools[level].pop() : null;
}

function returnWordToPool(level, word){
  const pool = wordPools[level];
  if(!pool) return;
  const idx = Math.floor(Math.random() * (pool.length + 1));
  pool.splice(idx, 0, word);
}

function returnRoundWords(exceptLevel){
  Object.keys(currentRoundWords).forEach(lv => {
    if(lv === exceptLevel) return;
    returnWordToPool(lv, currentRoundWords[lv]);
  });
}

const authErrorEl = document.getElementById("authError");
const authSubmitBtnEl = document.getElementById("authSubmitBtn");
const userBadgeEl = document.getElementById("userBadge");
const usernameLabelEl = document.getElementById("usernameLabel");
const logoutBtnEl = document.getElementById("logoutBtn");

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function sbFetch(path, options={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> "");
    throw new Error(`Supabase请求失败(${res.status}): ${errText}`);
  }
  if(res.status === 204) return null;
  return res.json();
}

async function fetchAccount(username){
  const rows = await sbFetch(`accounts?username=eq.${encodeURIComponent(username)}&select=*`);
  return rows && rows.length ? rows[0] : null;
}

async function createAccount(username, passwordHash){
  const rows = await sbFetch(`accounts`, {
    method: "POST",
    headers: { "Prefer": "return=representation" },
    body: JSON.stringify({ username, password_hash: passwordHash })
  });
  return rows[0];
}

async function insertGameRecord(username, score){
  const rows = await sbFetch(`game_records`, {
    method: "POST",
    headers: { "Prefer": "return=representation" },
    body: JSON.stringify({ username, score })
  });
  return rows[0];
}

async function fetchOthersBestScores(username){
  const rows = await sbFetch(`game_records?username=neq.${encodeURIComponent(username)}&select=username,score`);
  const bestByUser = new Map();
  rows.forEach(r => {
    const best = bestByUser.get(r.username);
    if(best === undefined || r.score > best) bestByUser.set(r.username, r.score);
  });
  return Array.from(bestByUser, ([username, score]) => ({ username, score }));
}

async function fetchPersonalBest(username){
  const rows = await sbFetch(`game_records?username=eq.${encodeURIComponent(username)}&select=score&order=score.desc&limit=1`);
  return rows.length ? rows[0].score : 0;
}

function getCurrentUsername(){
  return localStorage.getItem(CURRENT_USER_KEY);
}

function setCurrentUsername(name){
  if(name) localStorage.setItem(CURRENT_USER_KEY, name);
  else localStorage.removeItem(CURRENT_USER_KEY);
}

function showAuthOverlay(){
  authOverlayEl.style.display = "flex";
  userBadgeEl.style.display = "none";
  authUsernameEl.value = "";
  authPasswordEl.value = "";
  authErrorEl.textContent = "";
  authUsernameEl.focus();
}

function enterGame(username){
  authOverlayEl.style.display = "none";
  userBadgeEl.style.display = "flex";
  usernameLabelEl.textContent = username;
  resetGame();
}

async function handleAuthSubmit(){
  const username = authUsernameEl.value.trim();
  const password = authPasswordEl.value;
  authErrorEl.textContent = "";
  if(!username){ authErrorEl.textContent = "请输入用户名"; return; }
  if(!password){ authErrorEl.textContent = "请输入密码"; return; }

  authSubmitBtnEl.disabled = true;
  const originalLabel = authSubmitBtnEl.textContent;
  authSubmitBtnEl.textContent = "连接中...";

  try{
    const passwordHash = await sha256Hex(password);
    const existing = await fetchAccount(username);
    if(existing){
      if(existing.password_hash !== passwordHash){
        authErrorEl.textContent = "密码不正确";
        return;
      }
    }else{
      try{
        await createAccount(username, passwordHash);
      }catch(err){
        authErrorEl.textContent = "该用户名可能已被注册，请重试";
        return;
      }
    }
    setCurrentUsername(username);
    enterGame(username);
  }catch(err){
    console.error(err);
    authErrorEl.textContent = "网络错误，请检查网络后重试";
  }finally{
    authSubmitBtnEl.disabled = false;
    authSubmitBtnEl.textContent = originalLabel;
  }
}

function handleLogout(){
  clearTimer();
  setCurrentUsername(null);
  showAuthOverlay();
}

authSubmitBtnEl.addEventListener("click", handleAuthSubmit);
logoutBtnEl.addEventListener("click", handleLogout);
[authUsernameEl, authPasswordEl].forEach(el=>{
  el.addEventListener("keydown", e=>{
    if(e.key === "Enter") handleAuthSubmit();
  });
});

function buildRoundWords(){
  const words = {};
  Object.keys(LEVELS).forEach(lv => {
    const w = drawWord(lv);
    if(w) words[lv] = w;
  });
  return words;
}

function buildMeaningChoices(correctZh){
  const wrongPool = ALL_MEANINGS.filter(m => m !== correctZh);
  const wrongs = [];
  while(wrongs.length < 3 && wrongPool.length){
    const idx = Math.floor(Math.random()*wrongPool.length);
    const val = wrongPool.splice(idx,1)[0];
    if(!wrongs.includes(val)) wrongs.push(val);
  }
  const choices = [correctZh, ...wrongs];
  for(let i=choices.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [choices[i],choices[j]] = [choices[j],choices[i]];
  }
  return choices;
}

function updateTopStats(){
  goldCountEl.textContent = gold;
  roundCountEl.textContent = round;
  correctCountEl.textContent = correctCount;
  earnedCountEl.textContent = earnedCount;
}

function clearTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
}

function startTimerBar(onTimeout){
  timeLeft = ROUND_TIME;
  const bar = document.getElementById("timerBar");
  clearTimer();
  timerId = setInterval(()=>{
    timeLeft -= 0.1;
    if(bar) bar.style.width = Math.max(0,(timeLeft/ROUND_TIME*100)) + "%";
    if(timeLeft <= 0){
      clearTimer();
      onTimeout();
    }
  }, 100);
}

function startRound(){
  if(gold < ROUND_COST){
    endGame();
    return;
  }
  gold -= ROUND_COST;
  round += 1;
  updateTopStats();
  currentRoundWords = buildRoundWords();
  if(Object.keys(currentRoundWords).length === 0){
    endGame();
    return;
  }
  stage = "picking";
  renderPicking();
}

function renderTimerWrap(){
  return `<div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>`;
}

function renderPicking(){
  const w = currentRoundWords;
  card.innerHTML = `
    ${renderTimerWrap()}
    <div class="stage-label">选择一个单词进行挑战（等级越高奖励越多）</div>
    <div class="word-grid">
      ${Object.keys(w).map(lv => {
        const info = LEVELS[lv];
        const [en, phonetic] = w[lv];
        return `<div class="word-btn" data-lv="${lv}">
          <span class="level-tag ${info.cls}">${info.label} · +${info.reward}金币</span>
          <span class="en">${en}</span>
          <span class="phonetic">${phonetic}</span>
        </div>`;
      }).join("")}
    </div>
  `;
  document.getElementById("timerBar").style.width = "100%";
  document.querySelectorAll(".word-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(stage !== "picking") return;
      onWordPicked(btn.dataset.lv);
    });
  });
  startTimerBar(()=> onTimeout());
}

function onWordPicked(lv){
  clearTimer();
  stage = "meaning";
  renderMeaning(lv);
}

function renderMeaning(lv){
  const info = LEVELS[lv];
  const [en, phonetic, zh] = currentRoundWords[lv];
  const choices = buildMeaningChoices(zh);
  card.innerHTML = `
    ${renderTimerWrap()}
    <div class="selected-word">
      <div class="en">${en}</div>
      <div class="phonetic">${phonetic}</div>
      <span class="tag ${info.cls}">${info.label} · 答对得 ${info.reward} 金币</span>
    </div>
    <div class="meaning-grid">
      ${choices.map(c => `<div class="meaning-btn" data-zh="${c}">${c}</div>`).join("")}
    </div>
  `;
  document.getElementById("timerBar").style.width = Math.max(0,(timeLeft/ROUND_TIME*100)) + "%";
  document.querySelectorAll(".meaning-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(stage !== "meaning") return;
      onMeaningPicked(btn.dataset.zh, zh, lv);
    });
  });
  startTimerBar(()=> onTimeout(lv, zh));
}

function onMeaningPicked(picked, correctZh, lv){
  clearTimer();
  stage = "feedback";
  const isCorrect = picked === correctZh;
  document.querySelectorAll(".meaning-btn").forEach(btn=>{
    if(btn.dataset.zh === correctZh) btn.classList.add("correct");
    else if(btn.dataset.zh === picked) btn.classList.add("wrong");
  });
  if(isCorrect){
    const reward = LEVELS[lv].reward;
    gold += reward;
    correctCount += 1;
    earnedCount += reward;
    updateTopStats();
    returnRoundWords(lv);
    showFeedback(true, `回答正确！获得 ${reward} 金币`, `当前金币：${gold}`);
  }else{
    const penalty = LEVELS[lv].reward;
    gold = Math.max(0, gold - penalty);
    updateTopStats();
    returnRoundWords();
    const [en, phonetic] = currentRoundWords[lv];
    wrongWords.push({ en, phonetic, zh: correctZh });
    showFeedback(false, `回答错误，扣除 ${penalty} 金币`, `正确答案：${correctZh} · 当前金币：${gold}`);
  }
  scheduleNextRound();
}

function onTimeout(lv, correctZh){
  clearTimer();
  stage = "feedback";
  if(lv && correctZh){
    const penalty = LEVELS[lv].reward;
    gold = Math.max(0, gold - penalty);
    updateTopStats();
    const [en, phonetic] = currentRoundWords[lv];
    returnRoundWords();
    document.querySelectorAll(".meaning-btn").forEach(btn=>{
      if(btn.dataset.zh === correctZh) btn.classList.add("correct");
    });
    wrongWords.push({ en, phonetic, zh: correctZh });
    showFeedback(false, `超时啦，扣除 ${penalty} 金币`, `正确答案：${correctZh} · 当前金币：${gold}`);
  }else{
    returnRoundWords();
    showFeedback(false, `超时啦`, `未能及时选择单词`);
  }
  scheduleNextRound();
}

function showFeedback(good, main, sub){
  const toast = document.createElement("div");
  toast.className = "feedback " + (good ? "good":"bad");
  toast.innerHTML = `${main}<span class="sub">${sub}</span>`;
  card.appendChild(toast);
}

function scheduleNextRound(){
  setTimeout(()=>{
    if(gold < ROUND_COST){
      endGame();
    }else{
      startRound();
    }
  }, 1400);
}

async function endGame(){
  stage = "over";
  clearTimer();

  card.innerHTML = `<div class="feedback good">正在结算成绩...<span class="sub">正在连接排行榜</span></div>`;

  const username = getCurrentUsername();
  let record = null;
  let ranked = [];
  let myRank = 0;
  let totalUsers = 0;
  let above = null;
  let below = null;
  let personalBest = 0;
  let globalRanked = [];
  let leaderboardError = false;

  try{
    record = await insertGameRecord(username, earnedCount);

    const others = await fetchOthersBestScores(username);
    ranked = [...others, { username, score: earnedCount, isMe: true }]
      .sort((a,b) => b.score - a.score || a.username.localeCompare(b.username));
    const myIndex = ranked.findIndex(r => r.isMe);
    myRank = myIndex + 1;
    totalUsers = ranked.length;
    above = myIndex > 0 ? ranked[myIndex-1] : null;
    below = myIndex >= 0 && myIndex < ranked.length-1 ? ranked[myIndex+1] : null;

    personalBest = await fetchPersonalBest(username);
    globalRanked = [...others, { username, score: personalBest, isMe: true }]
      .sort((a,b) => b.score - a.score || a.username.localeCompare(b.username));
  }catch(err){
    console.error(err);
    leaderboardError = true;
  }

  const leaderboardHtml = leaderboardError
    ? `<div class="leaderboard">
        <div class="lb-title">🏆 本局排行榜</div>
        <div class="lb-me">排行榜加载失败，请检查网络连接后点"再来一局"重试</div>
      </div>`
    : `<div class="leaderboard">
        <div class="lb-title">🏆 本局排行榜</div>
        <div class="lb-me">
          <div>本局得分：<b>${record.score}</b></div>
          <div>历史最高单局：<b>${personalBest}</b></div>
          <div>本局排名：<b>第 ${myRank} 名</b>（共 ${totalUsers} 人）</div>
        </div>
        <div class="lb-list">
          ${above
            ? `<div class="leaderboard-row"><span>↑ ${escapeHtml(above.username)}</span><span>${above.score} 分</span></div>`
            : `<div class="leaderboard-row muted"><span>你已是第一名</span></div>`}
          <div class="leaderboard-row me"><span>${escapeHtml(username)}（我，本局）</span><span>${record.score} 分</span></div>
          ${below
            ? `<div class="leaderboard-row"><span>↓ ${escapeHtml(below.username)}</span><span>${below.score} 分</span></div>`
            : `<div class="leaderboard-row muted"><span>你已是最后一名</span></div>`}
        </div>
      </div>`;

  const globalBoardHtml = `
    <div class="global-board">
      <div class="lb-title">🏅 总排行榜</div>
      ${leaderboardError
        ? `<div class="global-empty">加载失败</div>`
        : (globalRanked.length
          ? globalRanked.map((r,i) => `
              <div class="global-row ${r.isMe ? "me":""} ${i===0?"top1":i===1?"top2":i===2?"top3":""}">
                <span class="global-rank">${i+1}</span>
                <span class="global-name">${escapeHtml(r.username)}${r.isMe ? "（我）":""}</span>
                <span class="global-score">${r.score}</span>
              </div>`).join("")
          : `<div class="global-empty">暂无数据</div>`)
      }
    </div>`;

  const wrongWordsHtml = wrongWords.length
    ? `<div class="wrong-words">
        <div class="lb-title">📖 本局背错的单词</div>
        <div class="wrong-list">
          ${wrongWords.map(w => `
            <div class="wrong-row">
              <span class="wrong-en">${escapeHtml(w.en)} <span class="wrong-phonetic">${escapeHtml(w.phonetic)}</span></span>
              <span class="wrong-zh">${escapeHtml(w.zh)}</span>
            </div>
          `).join("")}
        </div>
      </div>`
    : "";

  card.innerHTML = `
    <div class="result-layout">
      <div class="gameover">
        <h2>🎮 游戏结束</h2>
        <div class="final-score">本局得分 ${earnedCount}</div>
        <div class="row"><span>总轮数</span><span>${round}</span></div>
        <div class="row"><span>答对次数</span><span>${correctCount}</span></div>
        <div class="row"><span>正确率</span><span>${round ? Math.round(correctCount/round*100) : 0}%</span></div>
        ${wrongWordsHtml}
        ${leaderboardHtml}
        <button class="restart-btn" id="restartBtn">再来一局</button>
        <button class="switch-user-btn" id="switchUserBtn">切换账号</button>
      </div>
      ${globalBoardHtml}
    </div>
  `;
  document.getElementById("restartBtn").addEventListener("click", resetGame);
  document.getElementById("switchUserBtn").addEventListener("click", handleLogout);
}

function resetGame(){
  gold = START_GOLD;
  round = 0;
  correctCount = 0;
  earnedCount = 0;
  wrongWords = [];
  resetWordPools();
  updateTopStats();
  startRound();
}

async function init(){
  const savedUser = getCurrentUsername();
  if(savedUser){
    try{
      const account = await fetchAccount(savedUser);
      if(account){
        enterGame(savedUser);
        return;
      }
    }catch(err){
      console.error(err);
    }
  }
  showAuthOverlay();
}

init();
</script>
